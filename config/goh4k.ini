; Goh4kMod proxy settings. Read by the game's d3d11.dll at startup (restart the game after editing;
; no redeploy needed, this file never goes into the game folder).
[proxy]
; 0 = only forward d3d11 exports and log device creation; 1 = wrap the game's device, contexts and swapchain
Wrap=1
; 1 = pass-through. 2x rendering arrives in milestone 3.
Scale=2
; how often (ms) captures/status.txt is rewritten from Present
StatusMs=1000
