; Goh4kMod proxy settings (dev build). Read by the game's d3d11.dll at startup; restart the game after editing.
; This file never goes into the game folder. The shared release build reads goh4k.ini next to the DLL instead.
[proxy]
; 0 = only forward d3d11 exports and log device creation; 1 = wrap the game's device, contexts and swapchain
Wrap=1
; 1 = the game keeps its own resolution and renders natively; only its client size and mouse are divided by
; real height / 1080, so the UI lays out at its 1080p size. 0 = pass-through
UiScale=1
; 1 = captures/request.txt, Ctrl+Shift+F11 and captures/status.txt
Diagnostics=1
; processes the mod acts on (others get a pure pass-through); proxytest.exe is the local smoke test
Exe=call_to_arms.exe;proxytest.exe
; how often (ms) captures/status.txt is rewritten from Present
StatusMs=1000
